[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "location-enquiry-assistant"
version = "0.1.0"
description = "Sales and support copilot for location API enquiries"
requires-python = ">=3.12"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["copilot*", "mapping", "contracts", "schemas", "vocab"]
exclude = ["copilot.*.results*"]

[tool.setuptools.package-data]
copilot = [
    "case_storage/schema.sql",
    "config/*.json",
    "config/*.yaml",
    "enquiry_interpretation/*.json",
    "enquiry_interpretation/prompts/*.txt",
    "rag/data/processed/chunks.jsonl",
]
contracts = ["interpretation/*.json", "evaluation/*.json", "diagnostics/*.json", "qualification/*.json"]
mapping = ["label_overrides.json"]
schemas = ["*.json"]
vocab = ["controlled-vocabulary.json"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-app.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
retrieval = {file = ["copilot/rag/requirements-retrieval.txt"]}
