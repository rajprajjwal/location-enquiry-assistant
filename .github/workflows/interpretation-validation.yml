# Purpose: test interpretation validation and fail if generated models drift.
# Use case: pull requests that touch the interpretation schemas or rules.
# Example: job interpretation-model-drift regenerates copilot/models/generated.
name: interpretation-validation

on:
  push:
  pull_request:

jobs:
  interpretation-validation-tests:
    name: interpretation-validation-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run interpretation validation tests
        run: python -m pytest -q tests/validation

  interpretation-model-drift:
    name: interpretation-model-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regenerate models and fail on any diff
        run: |
          python scripts/gen_models.py
          if [ -n "$(git status --porcelain -- copilot/models/generated)" ]; then
            git status --porcelain -- copilot/models/generated
            git diff -- copilot/models/generated
            exit 1
          fi
